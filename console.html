function hzHue(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%360;}

function hzCard(r){
  const on=HZ.fav.has(r.id), hue=hzHue(r.title), hasImg=!!(r.img||HZ.img.has(r.id));
  const th=hasImg
    ? '<img loading="lazy" src="/api/huazi/preview/'+r.id+'" alt="">'
    : '<div class="ph" style="background:linear-gradient(145deg,hsl('+hue+' 66% 90%),hsl('+((hue+38)%360)+' 70% 80%));color:hsl('+hue+' 58% 34%)">'+esc(r.title.slice(0,1))+'</div>';
  const tags=(r.vip?'<span class="hz-tag vip">VIP</span>':'')
    +(r.cat&&r.cat!=='未分类'?'<span class="hz-tag cat">'+esc(r.cat)+'</span>':'')
    +(hasImg?'<span class="hz-tag img">有图</span>':'');
  return '<div class="hz-card'+(on?' on':'')+'" data-id="'+r.id+'" onclick="hzToggle(\''+r.id+'\')">'
    +'<div class="hz-sw">'+(on?'✓':'')+'</div>'
    +'<div class="hz-tb">'+th+'</div>'
    +'<div class="hz-md"><div class="t">'+esc(r.title)+'</div>'
    +'<div class="i">'+r.id+'</div><div class="hz-tags">'+tags+'</div></div></div>';
}

function hzPass(r){
  if(HZ.vip==='vip'&&!r.vip) return false;
  if(HZ.vip==='free'&&r.vip) return false;
  if(HZ.onlyImg&&!(r.img||HZ.img.has(r.id))) return false;
  if(HZ.onlyFav&&!HZ.fav.has(r.id)) return false;
  if(HZ.cat&&r.cat!==HZ.cat) return false;
  if(HZ.q){
    const q=HZ.q.toLowerCase();
    if(!(r.title.toLowerCase().indexOf(q)>=0||r.id.indexOf(q)>=0)) return false;
  }
  return true;
}

function hzRenderGrid(){
  const shown=HZ.rows.filter(hzPass), g=$('#hzGrid');
  if(g) g.innerHTML=shown.slice(0,HZ.limit).map(hzCard).join('')||'<div class="empty">没有匹配的花字</div>';
  const m=$('#hzMore');
  if(m){ m.style.display=shown.length>HZ.limit?'block':'none';
    m.textContent='显示更多（已显示 '+Math.min(HZ.limit,shown.length)+' / '+shown.length+'）'; }
  const c=$('#hzCount'); if(c) c.textContent='匹配 '+shown.length+' 条';
}

function hzRenderFav(){
  const el=$('#hzFavGrid'); if(!el) return;
  const on=HZ.rows.filter(r=>HZ.fav.has(r.id));
  el.innerHTML=on.map(hzCard).join('')||'<div class="empty">当前没有启用任何花字</div>';
  const c=$('#hzFavCount'); if(c) c.textContent=HZ.fav.size;
}

function hzRenderFonts(){
  const el=$('#hzFonts'); if(!el) return;
  el.innerHTML=HZ.fonts.map(f=>'<span class="font-pill'+(HZ.fvFonts.has(f)?' on':'')+'" data-f="'+esc(f)+'">'+esc(f)+'</span>').join('')
    ||'<span class="empty">字体池为空</span>';
  el.querySelectorAll('.font-pill').forEach(p=>{ p.onclick=()=>hzToggleFont(p.dataset.f); });
}

function renderHuazi(){
  const rows=HZ.rows;
  const cats=[...new Set(rows.map(r=>r.cat))].filter(c=>c&&c!=='未分类').sort();
  const catOpts=cats.map(c=>'<option value="'+esc(c)+'"'+(HZ.cat===c?' selected':'')+'>'+esc(c)+'（'+rows.filter(r=>r.cat===c).length+'）</option>').join('');
  $('#content').innerHTML=
  '<section><h2>已启用 <span id="hzFavCount">'+HZ.fav.size+'</span> 个花字'
   +'<span class="hint">出片时从这里随机挑 1 个用在标题上</span></h2>'
   +'<div class="hz-grid" id="hzFavGrid"></div></section>'
  +'<section class="hz-section"><h2>标题字体池 '
   +'<span class="hint">与花字叠加使用；点击切换启用</span></h2><div id="hzFonts"></div></section>'
  +'<section class="hz-section"><h2>全部花字 '
   +'<span class="hint">共 '+rows.length+' 条 · 有预览图 '+rows.filter(r=>r.img).length+' 条 · 点卡片 = 启用 / 取消</span></h2>'
   +'<div class="hz-bar">'
   +'<input type="search" id="hzQ" placeholder="搜索名称或 ID…">'
   +'<select id="hzCat"><option value="">全部分类</option>'+catOpts+'</select>'
   +'<select id="hzVip"><option value="">全部</option>'
   +'<option value="vip"'+(HZ.vip==='vip'?' selected':'')+'>仅 VIP（'+rows.filter(r=>r.vip).length+'）</option>'
   +'<option value="free"'+(HZ.vip==='free'?' selected':'')+'>仅免费（'+rows.filter(r=>!r.vip).length+'）</option></select>'
   +'<label class="hz-chk'+(HZ.onlyImg?' on':'')+'" id="hzOnlyImgLbl">'
   +'<input type="checkbox" id="hzOnlyImg"'+(HZ.onlyImg?' checked':'')+'>只看有预览图（'+rows.filter(r=>r.img).length+'）</label>'
   +'<label class="hz-chk'+(HZ.onlyFav?' on':'')+'" id="hzOnlyFavLbl">'
   +'<input type="checkbox" id="hzOnlyFav"'+(HZ.onlyFav?' checked':'')+'>只看已启用</label>'
   +'<span id="hzCount" style="font-size:12.5px;color:var(--muted);margin-left:auto"></span></div>'
   +'<div class="hz-grid" id="hzGrid"></div>'
   +'<button class="hz-more" id="hzMore">显示更多</button></section>';

  hzRenderFav(); hzRenderFonts(); hzRenderGrid(); updateHzSaveBar();

  $('#hzQ').addEventListener('input',e=>{ HZ.q=e.target.value.trim(); HZ.limit=HZ_PAGE; hzRenderGrid(); });
  $('#hzCat').addEventListener('change',e=>{ HZ.cat=e.target.value; HZ.limit=HZ_PAGE; hzRenderGrid(); });
  $('#hzVip').addEventListener('change',e=>{ HZ.vip=e.target.value; HZ.limit=HZ_PAGE; hzRenderGrid(); });
  $('#hzOnlyImg').addEventListener('change',e=>{
    HZ.onlyImg=e.target.checked; HZ.limit=HZ_PAGE;
    $('#hzOnlyImgLbl').classList.toggle('on',e.target.checked);
    hzRenderGrid();
  });
  $('#hzOnlyFav').addEventListener('change',e=>{
    HZ.onlyFav=e.target.checked; HZ.limit=HZ_PAGE;
    $('#hzOnlyFavLbl').classList.toggle('on',e.target.checked);
    hzRenderGrid();
  });
  $('#hzMore').addEventListener('click',()=>{ HZ.limit+=HZ_PAGE; hzRenderGrid(); });
}

function hzToggle(id){
  const on=!HZ.fav.has(id);
  if(on) HZ.fav.add(id); else HZ.fav.delete(id);
  if(HZ.onlyFav){ hzRenderGrid(); }
  else{
    document.querySelectorAll('#hzGrid .hz-card[data-id="'+id+'"]').forEach(c=>{
      c.classList.toggle('on',on);
      const sw=c.querySelector('.hz-sw'); if(sw) sw.textContent=on?'✓':'';
    });
  }
  hzRenderFav(); updateHzSaveBar();
}

function hzToggleFont(name){
  if(HZ.fvFonts.has(name)) HZ.fvFonts.delete(name); else HZ.fvFonts.add(name);
  hzRenderFonts(); updateHzSaveBar();
}

function hzDiffCount(){
  let n=0;
  HZ.fav.forEach(i=>{ if(!HZ.origFav.has(i)) n++; });
  HZ.origFav.forEach(i=>{ if(!HZ.fav.has(i)) n++; });
  HZ.fvFonts.forEach(f=>{ if(!HZ.origFonts.has(f)) n++; });
  HZ.origFonts.forEach(f=>{ if(!HZ.fvFonts.has(f)) n++; });
  return n;
}

function updateHzSaveBar(){
  const box=$('#hzSave'); if(!box) return;
  const n=hzDiffCount(), d=$('#hzDiff');
  if(d) d.textContent=n;
  box.classList.toggle('show',n>0);
}

function hzRevert(){
  HZ.fav=new Set(HZ.origFav); HZ.fvFonts=new Set(HZ.origFonts);
  hzRenderFav(); hzRenderFonts(); hzRenderGrid(); updateHzSaveBar();
  toast('已撤销，回到上次保存的状态','info');
}

async function hzSave(){
  if(HZ.fav.size===0){ toast('启用池不能为空——至少留 1 个花字，否则标题会没有花字效果','err'); return; }
  const btn=$('#hzSaveBtn');
  if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
  try{
    const d=await jpost('/api/huazi/fav',{ids:[...HZ.fav],fonts:[...HZ.fvFonts]});
    HZ.origFav=new Set(HZ.fav); HZ.origFonts=new Set(HZ.fvFonts);
    updateHzSaveBar();
    let msg='已保存：启用 '+d.count+' 个花字、'+(d.font_count!=null?d.font_count:HZ.fvFonts.size)+' 款字体';
    if(d.backup) msg+='（已备份 '+d.backup+'）';
    toast(msg,'ok');
  }catch(e){ toast('保存失败：'+e.message,'err'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='💾 保存'; } }
}

/* ══════════════════ 文案库（库编辑 + 本店选用 + 使用次数） ══════════════════ */
const CP={
  key:null, label:'', path:'', rel:'', is_default:false, exists:true,
  default_rel:'', default_path:'',
  rows:[], orig:'[]',
  filter:{exclude_types:[],only:[],exclude:[]}, filterDefault:true, effective:0,
  types:[], total:0, used_total:0, unused_total:0, stale:[], stale_total:0,
  tab:'lib', q:'', tf:'', limit:80, armed:false, staleOpen:false,
};

function cpJson(){ return JSON.stringify(CP.rows.map(r=>[r.type,r.text])); }
function cpDirtyCnt(){
  let n=0;
  const a=CP.rows.map(r=>r.type+'\u0001'+r.text);
  const b=JSON.parse(CP.orig).map(x=>x[0]+'\u0001'+x[1]);
  a.forEach(x=>{ if(b.indexOf(x)<0) n++; });
  b.forEach(x=>{ if(a.indexOf(x)<0) n++; });
  return n;
}
function cpIsDefaultFilter(){
  const f=CP.filter;
  return !((f.exclude_types||[]).length || (f.only||[]).length || (f.exclude||[]).length);
}
function cpRecalc(){
  const ex=new Set(CP.filter.exclude_types||[]);
  const only=new Set(CP.filter.only||[]);
  const exl=new Set(CP.filter.exclude||[]);
  const seen=new Set(); let n=0;
  CP.rows.forEach(r=>{
    const t=(r.text||'').trim();
    if(!t || seen.has(t)) return;
    if(only.size && !only.has(t)) return;
    if(ex.has(r.type)) return;
    if(exl.has(t)) return;
    seen.add(t); n++;
  });
  CP.effective=n;
  CP.filterDefault=cpIsDefaultFilter();
}

/* ---------- 进入 / 载入 ---------- */
async function showCopy(){
  const key=STATE.key || STATE.lastKey || (((STATE.stores&&STATE.stores.stores)||[])[0]||{}).key;
  if(!key){ toast('先在左侧选一个店面，再编辑它的文案库','info'); return; }
  STATE.key=key;
  const wantPick=(location.hash==='#copy-pick');   // ⚠ 必须在 replaceState 之前读
  try{ history.replaceState(null,'','#copy'); }catch(e){}
  document.querySelectorAll('.store').forEach(n=>n.classList.toggle('active',n.dataset.k===key));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  $('#navCopy').classList.add('active');
  $('#btnDelStore').style.display='none';
  const sb=$('#hzSave'); if(sb) sb.classList.remove('show');
  const bsb=$('#bgmSave'); if(bsb) bsb.classList.remove('show');
  bgmStopPlay();
  const meta=((STATE.stores&&STATE.stores.stores)||[]).find(s=>s.key===key)||{};
  CP.key=key; CP.label=meta.label||key;
  CP.tab=wantPick?'pick':'lib';
  CP.q=''; CP.tf=''; CP.limit=80; CP.armed=false; CP.staleOpen=false;
  $('#pageTitle').textContent='文案库 · '+CP.label;
  $('#content').innerHTML='<div class="empty">正在加载文案库…</div>';
  await cpLoad();
}

async function cpLoad(){
  try{
    cpApply(await jget('/api/copy?key='+encodeURIComponent(CP.key)));
    renderCopy();
  }catch(e){
    $('#content').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';
  }
}

function cpApply(d){
  CP.path=d.path; CP.rel=d.rel; CP.is_default=d.is_default; CP.exists=d.exists;
  CP.default_rel=d.default_rel; CP.default_path=d.default_path;
  CP.rows=(d.rows||[]).map(r=>({type:r.type,text:r.text,count:r.count,count_store:r.count_store}));
  CP._snapshot=JSON.parse(JSON.stringify(CP.rows));
  CP.orig=cpJson();
  CP.filter=d.filter||{exclude_types:[],only:[],exclude:[]};
  CP.filterDefault=!!d.filter_is_default;
  CP.effective=d.effective||0;
  CP.types=d.types||[]; CP.total=d.total||0;
  CP.used_total=d.used_total||0; CP.unused_total=d.unused_total||0;
  CP.stale=d.stale||[]; CP.stale_total=d.stale_total||0;
  CP.armed=false;
}

/* ---------- 主渲染 ---------- */
function renderCopy(){
  const tabs='<div class="cp-tabs">'
    +'<div class="cp-tab'+(CP.tab==='lib'?' on':'')+'" onclick="cpTab(\'lib\')">📚 编辑文案库</div>'
    +'<div class="cp-tab'+(CP.tab==='pick'?' on':'')+'" onclick="cpTab(\'pick\')">🎯 「'+esc(CP.label)+'」选用哪些</div>'
    +'</div>';

  else{ $('#content').innerHTML=tabs+cpPickHtml(); cpPickBind(); }

function cpTab(t){
  if(t===CP.tab) return;
  if(CP.tab==='lib' && cpDirtyCnt()>0){ toast('文案还有未保存的改动——请先「保存」或「撤销」再切走','info'); return; }
  CP.tab=t; CP.q=''; CP.tf=''; CP.limit=80; CP.staleOpen=false;
  renderCopy();
}

function cpRowHtml(r,i){

    +'<span class="cp-n'+hot+'" title="全部店面累计用过 '+r.count+' 次">'+r.count+'</span>'
    +'<span class="cp-n2'+(r.count_store>0?' hot':'')+'" title="本店用过 '+r.count_store+' 次">'+r.count_store+'</span>'
    +'<button class="cp-x" onclick="cpDel('+i+')" title="删除这条">✕</button>'
    +'</div>';
}

function cpPass(r){
  if(CP.tf && r.type!==CP.tf) return false;
  if(CP.q){
    const q=CP.q.toLowerCase();
    if(!(r.text.toLowerCase().indexOf(q)>=0 || r.type.toLowerCase().indexOf(q)>=0)) return false;
  }
  return true;
}

function cpRenderRows(){
  const box=$('#cpRows'); if(!box) return;
  const vis=[];
  CP.rows.forEach((r,i)=>{ if(cpPass(r)) vis.push({r:r,i:i}); });
  box.innerHTML = vis.slice(0,CP.limit).map(o=>cpRowHtml(o.r,o.i)).join('')
    || '<div class="empty">没有匹配的文案</div>';
  const m=$('#cpMore');
  if(m){ m.style.display=vis.length>CP.limit?'block':'none';
    m.textContent='显示更多（已显示 '+Math.min(CP.limit,vis.length)+' / '+vis.length+'）'; }
  const c=$('#cpCount'); if(c) c.textContent=vis.length;
}

function cpLibBind(){
  const q=$('#cpQ');
  if(q) q.addEventListener('input',e=>{ CP.q=e.target.value.trim(); CP.limit=80; cpRenderRows(); });
  const tc=$('#cpTypeChips');
  if(tc) tc.addEventListener('click',e=>{
    const c=e.target.closest('.cp-chip'); if(!c) return;
    CP.tf=c.dataset.t||''; CP.limit=80;
    tc.querySelectorAll('.cp-chip').forEach(x=>x.classList.toggle('on',x===c));
    cpRenderRows();
  });
  const m=$('#cpMore');
  if(m) m.addEventListener('click',()=>{ CP.limit+=80; cpRenderRows(); });
}

function cpStaleToggle(){ CP.staleOpen=!CP.staleOpen; renderCopy(); }

function cpType(i,v){
  if(!CP.rows[i]) return;
  CP.rows[i].type=(v||'').trim()||'未分类';
  updateCpSaveBar();
}
function cpText(i,v){
  if(!CP.rows[i]) return;
  CP.rows[i].text=v;
  // 只更新「是否为空」的样式，不重绘（否则输入框会失焦）
  updateCpSaveBar();
}
function cpDel(i){
  if(!CP.rows[i]) return;
  CP.rows.splice(i,1);
  cpRenderRows(); updateCpSaveBar();
  toast('已删除这条（点「撤销」可恢复）','info');
}
function cpAdd(){
  const t=CP.tf || (CP.types[0]&&CP.types[0].name) || '未分类';
  CP.q=''; CP.tf='';
  const q=$('#cpQ'); if(q) q.value='';
  CP.rows.unshift({type:t,text:'',count:0,count_store:0});
  cpRenderRows();
  const inp=$('#cpRows .cp-in'); if(inp){ inp.focus(); }
  updateCpSaveBar();
  toast('已在最上面新增一条，填好文案后记得保存','info');
}

/* ---------- Tab2：本店选用 ---------- */
function cpPickHtml(){
  const ex=new Set(CP.filter.exclude_types||[]);
  const only=new Set(CP.filter.only||[]);
  const off=CP.filterDefault?' off':'';
  const chips=CP.types.map(t=>'<span class="cp-chip'+(ex.has(t.name)?' ex':'')+'" data-t="'+esc(t.name)+'">'
    +esc(t.name)+'<span class="n">'+t.count+'</span></span>').join('');
  const list=CP.rows.map(r=>{
    const on=only.has(r.text);
    return '<div class="cp-pr'+(on?' on':'')+'" data-x="'+esc(r.text)+'">'
      +'<span>'+(on?'☑':'☐')+'</span>'
      +'<span class="tg">'+esc(r.type)+'</span>'
      +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.text)+'</span>'
      +'<span class="n">'+r.count+'</span></div>';
  }).join('');

  return '<section>'
   +'<h2>「'+esc(CP.label)+'」用文案库里的哪些 <span class="hint">不设限制 = 用全部（默认）</span></h2>'
   +'<div class="cp-mode">'
   +'<label class="cp-radio'+(CP.filterDefault?' on':'')+'" onclick="cpModeAll()">'
   +'<input type="radio" name="cpmode"'+(CP.filterDefault?' checked':'')+'> 使用全部（默认）</label>'
   +'<label class="cp-radio'+(!CP.filterDefault?' on':'')+'" onclick="cpModeCustom()">'
   +'<input type="radio" name="cpmode"'+(!CP.filterDefault?' checked':'')+'> 自定义</label>'
   +'<span class="cp-eff">本店生效 <b id="cpEff">'+CP.effective+'</b> / '+CP.total+' 条</span>'
   +'</div>'
   +'<div class="cp-block'+off+'">'
   +'<div class="cp-lab">① 按类型排除 <span class="hint">点一下 = 这类不要（变红）</span></div>'
   +'<div class="cp-chips" id="cpExChips">'+chips+'</div></div>'
   +'<div class="cp-block'+off+'">'
   +'<div class="cp-lab">② 单条挑选 <span class="hint">勾中 = 只用勾中的；一条不勾 = 不启用这条规则</span>'
   +'<button class="btn ghost sm" onclick="cpOnlyAll(1)">全选</button>'
   +'<button class="btn ghost sm" onclick="cpOnlyAll(0)">清空</button>'
   +'<span class="hint">已勾 <b id="cpOnlyN">'+only.size+'</b> 条</span></div>'
   +'<div class="cp-pick" id="cpPickList">'+list+'</div></div>'
   +'<div class="cp-bar">'
   +'<button class="btn primary" onclick="cpSaveFilter()">💾 保存本店选用</button>'
   +'<button class="btn ghost" onclick="cpResetFilter()">↺ 恢复「使用全部」</button>'
   +'<span class="hint" style="margin-left:auto">出片时从「本店生效」的文案里按用得最少来挑</span>'
   +'</div></section>';
}

function cpPickBind(){
  const ex=$('#cpExChips');
  if(ex) ex.addEventListener('click',e=>{
    const c=e.target.closest('.cp-chip'); if(!c) return;
    cpToggleEx(c.dataset.t||'');
  });
  const pl=$('#cpPickList');
  if(pl) pl.addEventListener('click',e=>{
    const r=e.target.closest('.cp-pr'); if(!r) return;
    cpTogglePick(r.dataset.x||'');
  });
}

function cpSyncEff(){
  const e=$('#cpEff'); if(e) e.textContent=CP.effective;
  const n=$('#cpOnlyN'); if(n) n.textContent=(CP.filter.only||[]).length;
}
function cpModeAll(){
  CP.filter={exclude_types:[],only:[],exclude:[]};
  renderCopy();
  toast('已选「使用全部」——记得点「保存本店选用」','info');
}
function cpModeCustom(){
  if(CP.filterDefault){ CP.filter={exclude_types:[],only:[],exclude:[]}; }
  renderCopy();
}
function cpToggleEx(name){
  const s=new Set(CP.filter.exclude_types||[]);
  if(s.has(name)) s.delete(name); else s.add(name);
  CP.filter.exclude_types=[...s];
  cpRecalc();
  const el=document.querySelector('#cpExChips .cp-chip[data-t="'+CSS.escape(name)+'"]');
  if(el) el.classList.toggle('ex');
  cpSyncEff();
  document.querySelectorAll('.cp-radio').forEach((r,i)=>r.classList.toggle('on', CP.filterDefault?i===0:i===1));
}
function cpTogglePick(text){
  const s=new Set(CP.filter.only||[]);
  if(s.has(text)) s.delete(text); else s.add(text);
  CP.filter.only=[...s];
  cpRecalc();
  document.querySelectorAll('#cpPickList .cp-pr').forEach(el=>{
    if(el.dataset.x===text){
      const on=s.has(text);
      el.classList.toggle('on',on);
      const t=el.firstElementChild; if(t) t.textContent=on?'☑':'☐';
    }
  });
  cpSyncEff();
  document.querySelectorAll('.cp-radio').forEach((r,i)=>r.classList.toggle('on', CP.filterDefault?i===0:i===1));
}
function cpOnlyAll(on){
  CP.filter.only = on ? [...new Set(CP.rows.map(r=>r.text))] : [];
  cpRecalc(); renderCopy();
}

async function cpSaveFilter(){
  try{
    const d=await jpost('/api/stores/'+CP.key+'/copy_filter',
      {exclude_types:CP.filter.exclude_types, only:CP.filter.only, exclude:CP.filter.exclude});
    cpApply(d); renderCopy();
    toast('已保存本店选用：生效 '+d.effective+' 条','ok');
  }catch(e){ toast('保存失败：'+e.message,'err'); }
}
async function cpResetFilter(){
  try{
    const d=await jpost('/api/stores/'+CP.key+'/copy_filter',{reset:true});
    cpApply(d); renderCopy();
    toast('已恢复「使用全部」（'+d.effective+' 条）','ok');
  }catch(e){ toast('恢复失败：'+e.message,'err'); }
}

/* ---------- 保存 / 撤销 ---------- */
function resetCpBtn(){
  const b=$('#cpSaveBtn'); if(b){ b.disabled=false; b.textContent='💾 保存'; }
  const t=$('#cpDiffText');
  if(t) t.innerHTML='文案已改动 <span class="d" id="cpDiff">'+cpDirtyCnt()+'</span> 条，尚未保存';
}
function updateCpSaveBar(){
  const box=$('#cpSave'); if(!box) return;
  const n=cpDirtyCnt(), d=$('#cpDiff');
  if(d) d.textContent=n;
  box.classList.toggle('show', n>0 && CP.tab==='lib');
  if(n===0 && CP.armed){ CP.armed=false; resetCpBtn(); }
}
function cpRevert(){
  CP.armed=false;
  CP.rows=JSON.parse(JSON.stringify(CP._snapshot||[]));
  resetCpBtn(); renderCopy();
  toast('已撤销，回到上次保存的状态','info');
}
function cpGuard(msg){
  if(cpDirtyCnt()>0){ toast(msg||'有未保存的改动——请先「保存」或「撤销」','info'); return false; }
  return true;
}
async function cpSave(){
  const n=cpDirtyCnt();
  if(n===0){ toast('没有改动','info'); return; }
  const rows=CP.rows.map(r=>({type:r.type,text:(r.text||'').trim()})).filter(r=>r.text);
  if(!rows.length){ toast('文案库不能为空——至少留 1 条，否则出片没有标题','err'); return; }
  if(CP.is_default && !CP.armed){
    CP.armed=true;
    const b=$('#cpSaveBtn'); if(b) b.textContent='⚠ 确认改共享默认库';
    const t=$('#cpDiffText');
    if(t) t.innerHTML='<span style="color:#ffd666">共享默认库被多个店面共用，确认要改？</span>';
    toast('这是共享默认库：再点一次「确认改共享默认库」才会写入','info');
    setTimeout(()=>{ if(CP.armed){ CP.armed=false; resetCpBtn(); updateCpSaveBar(); } },6000);
    return;
  }
  CP.armed=false;
  const btn=$('#cpSaveBtn'); if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
  try{
    const d=await jpost('/api/copy',{entries:rows, key:CP.key});
    cpApply(d); renderCopy();
    let msg='已保存 '+d.count+' 条文案';
    if(d.is_default) msg+=' · 写入共享默认库';
    if(d.backup) msg+='（旧文件已备份）';
    toast(msg,'ok');
  }catch(e){ toast('保存失败：'+e.message,'err'); }
  finally{ const b=$('#cpSaveBtn'); if(b) b.disabled=false; resetCpBtn(); }
}

/* ---------- 换库文件 ---------- */
async function cpReload(){
  if(!cpGuard('有未保存的改动——请先「保存」或「撤销」，再重新载入')) return;
  await cpLoad(); toast('已重新载入','info');
}
async function cpPickFile(){
  if(!cpGuard('有未保存的改动——请先「保存」或「撤销」，再换库文件')) return;
  try{
    const r=await jget('/api/pick_file?prompt='+encodeURIComponent('选择文案库文件（.txt）'));
    if(r.cancelled) return;
    cpApply(await jpost('/api/stores/'+CP.key+'/copy',{path:r.path}));
    renderCopy();
    toast('已换到：'+basename(CP.path)+'（'+CP.total+' 条）','ok');
  }catch(e){ toast('换库失败：'+e.message,'err'); }
}
async function cpSaveAs(){
  const el=$('#cpAsName'); const name=(el&&el.value.trim())||'';
  if(!name){ toast('先给新库起个文件名，如「'+CP.label+'文案.txt」','info'); if(el) el.focus(); return; }
  if(!cpGuard('有未保存的改动——请先「保存」或「撤销」，再另存')) return;
  try{
    cpApply(await jpost('/api/stores/'+CP.key+'/copy',{save_as:name}));
    renderCopy();
    toast('已另存为 '+basename(CP.path)+'（'+CP.total+' 条），本店已切过去','ok');
  }catch(e){ toast('另存失败：'+e.message,'err'); }
}
async function cpRestoreDefault(){
  if(!cpGuard('有未保存的改动——请先「保存」或「撤销」，再恢复默认库')) return;
  try{
    cpApply(await jpost('/api/stores/'+CP.key+'/copy',{reset:true}));
    renderCopy();
    toast('已恢复共享默认库（'+CP.total+' 条）','ok');
  }catch(e){ toast('恢复失败：'+e.message,'err'); }
}

/* ---------- 导入 / 导出 ---------- */
function cpExport(){
  const p=new URLSearchParams({key:CP.key, with_type:'1'});
  if(CP.tf) p.set('types',CP.tf);
  const a=document.createElement('a');
  a.href='/api/copy/export?'+p.toString();
  a.download='';
  document.body.appendChild(a); a.click(); a.remove();
  toast('已导出'+(CP.tf?'（只含「'+CP.tf+'」）':'')+'，看浏览器下载','ok');
}
function openCpImport(){
  const t=$('#cpImpText'); if(t) t.value='';
  const f=$('#cpImpFile'); if(f) f.value='';
  $('#cpImpMask').classList.add('show');
}
function closeCpImport(){ $('#cpImpMask').classList.remove('show'); }
async function cpDoImport(){
  const el=$('#cpImpText');
  let text=(el&&el.value)||'';
  const f=($('#cpImpFile')||{}).files;
  if(f && f[0]){
    text += (text?'\n':'') + await f[0].text();
  }
  if(!text.trim()){ toast('先选个 txt 文件，或把文案粘进来','info'); return; }
  const mode=($('#cpImpMode')||{}).value||'merge';
  try{
    const d=await jpost('/api/copy/import',{text:text, mode:mode, key:CP.key});
    closeCpImport(); cpApply(d); renderCopy();
    toast('导入完成：解析 '+d.imported+' 条，新增 '+d.added+' 条，现共 '+d.count+' 条','ok');
  }catch(e){ toast('导入失败：'+e.message,'err'); }
}
</script>
</body>
</html>
